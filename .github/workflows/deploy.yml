name: GameVault Backend Deploy Pipeline

on:
  push:
    branches: [ pro ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test project
        run: ./mvnw clean test

  deploy:
    name: Build, Push and Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Login to Fly.io Docker Registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build Docker Image with Pro Profile
        run: docker build --build-arg SPRING_PROFILES_ACTIVE=pro -t registry.fly.io/gamevault-backend:latest .

      - name: Push Docker Image to Fly.io Registry
        run: docker push registry.fly.io/gamevault-backend:latest

      - name: Deploy to Fly.io
        run: flyctl deploy --image registry.fly.io/gamevault-backend:latest --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
